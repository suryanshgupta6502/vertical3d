<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopify Theme Iframe Embed Demo - 8x8 Custom Canopy Tent</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .top-banner {
      padding: 12px 24px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-banner h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
    }
    .badge {
      background: #10b981;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 9999px;
    }
    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }
    .event-log-panel {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 340px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      font-size: 11px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
    }
    .event-log-title {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .log-item {
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
      font-family: monospace;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="top-banner">
    <div>
      <h1>Parent Shopify Storefront (Host Page)</h1>
      <span style="font-size: 11px; color: #94a3b8;">Testing window.postMessage &amp; Iframe Embeddability</span>
    </div>
    <span class="badge">Iframe Bridge Active</span>
  </div>

  <iframe
    id="tent-configurator-iframe"
    class="iframe-wrapper"
    src="/"
    title="3D Canopy Tent Configurator"
  ></iframe>

  <div class="event-log-panel">
    <div class="event-log-title">
      <span>postMessage Event Monitor</span>
      <span style="font-size: 9px; color: #10b981;">LIVE</span>
    </div>
    <div id="event-log-content">
      <div class="log-item">Listening for CONFIGURATOR_SAVE...</div>
    </div>
  </div>

  <script>
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "CONFIGURATOR_SAVE") {
        const log = document.getElementById("event-log-content");
        const div = document.createElement("div");
        div.className = "log-item";
        div.style.color = "#34d399";
        div.innerHTML = `<strong>Received:</strong> ${event.data.type}<br>Design ID: ${event.data.payload.designId}<br>Total: $${event.data.payload.pricing?.subtotal || 599}`;
        log.prepend(div);
      }
    });
  </script>
</body>
</html>
